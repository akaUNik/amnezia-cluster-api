services:
  api:
    image: burdakovdv/amnezia-cluster-api:${API_IMAGE_TAG:-latest}
    env_file:
      - .env
    ports:
      - 127.0.0.1:${API_PORT:-8000}:8000
    expose:
      - 8000
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /opt/amnezia:/opt/amnezia:rw
      - ./src/management/protocols.yaml:/app/src/management/protocols.yaml:ro
    group_add:
      - "${DOCKER_SOCKET_GID:-0}"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    pids_limit: 256
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "--max-time", "3", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: always

  nginx:
    image: nginx:stable-alpine
    profiles:
      - nginx
    depends_on:
      api:
        condition: service_healthy
    environment:
      NGINX_SERVER_NAME: ${NGINX_SERVER_NAME:-${SERVER_PUBLIC_HOST:-localhost}}
      NGINX_SSL_CERTIFICATE: ${NGINX_SSL_CERTIFICATE:-/etc/nginx/certs/fullchain.pem}
      NGINX_SSL_CERTIFICATE_KEY: ${NGINX_SSL_CERTIFICATE_KEY:-/etc/nginx/certs/privkey.pem}
      NGINX_CLIENT_MAX_BODY_SIZE: ${NGINX_CLIENT_MAX_BODY_SIZE:-1m}
      NGINX_RATE_LIMIT_RATE: ${NGINX_RATE_LIMIT_RATE:-60r/m}
      NGINX_RATE_LIMIT_BURST: ${NGINX_RATE_LIMIT_BURST:-20}
    ports:
      - 80:80
      - 443:443
    volumes:
      - ./nginx/templates:/etc/nginx/templates:ro
      - ${NGINX_CERTS_PATH:-./nginx/certs}:/etc/nginx/certs:ro
      - ${CERTBOT_LETSENCRYPT_PATH:-./nginx/letsencrypt}:/etc/letsencrypt:ro
      - ${CERTBOT_WWW_PATH:-./nginx/certbot/www}:/var/www/certbot:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider --no-check-certificate https://127.0.0.1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: always

  certbot:
    image: certbot/certbot:latest
    profiles:
      - certbot
    environment:
      CERTBOT_EMAIL: ${CERTBOT_EMAIL:-}
      CERTBOT_DOMAIN: ${CERTBOT_DOMAIN:-${NGINX_SERVER_NAME:-${SERVER_PUBLIC_HOST:-}}}
    volumes:
      - ${CERTBOT_LETSENCRYPT_PATH:-./nginx/letsencrypt}:/etc/letsencrypt
      - ${CERTBOT_WWW_PATH:-./nginx/certbot/www}:/var/www/certbot
    entrypoint: /bin/sh
    command:
      - -c
      - |
        test -n "$$CERTBOT_EMAIL" || { echo "CERTBOT_EMAIL is required"; exit 1; }
        test -n "$$CERTBOT_DOMAIN" || { echo "CERTBOT_DOMAIN is required"; exit 1; }
        certbot certonly --webroot --webroot-path=/var/www/certbot --email "$$CERTBOT_EMAIL" --agree-tos --no-eff-email -d "$$CERTBOT_DOMAIN"
