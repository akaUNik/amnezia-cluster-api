services:
  api:
    build:
      context: .
      dockerfile: src/Dockerfile
    env_file:
      - .env
    ports:
      - 127.0.0.1:${API_PORT:-8000}:8000
    expose:
      - 8000
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /opt/amnezia:/opt/amnezia:rw
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    pids_limit: 256
    restart: always

  nginx:
    image: nginx:stable-alpine
    profiles:
      - nginx
    depends_on:
      - api
    environment:
      NGINX_SERVER_NAME: ${NGINX_SERVER_NAME:-localhost}
      NGINX_CLIENT_MAX_BODY_SIZE: ${NGINX_CLIENT_MAX_BODY_SIZE:-1m}
      NGINX_RATE_LIMIT_RATE: ${NGINX_RATE_LIMIT_RATE:-60r/m}
      NGINX_RATE_LIMIT_BURST: ${NGINX_RATE_LIMIT_BURST:-20}
    ports:
      - 80:80
      - 443:443
    volumes:
      - ./nginx/templates:/etc/nginx/templates:ro
      - ${NGINX_CERTS_PATH:-./nginx/certs}:/etc/nginx/certs:ro
    restart: always
