[project]
name = "amnezia-api"
version = "0.1.0"
description = ""
authors = [
    {name = "homostultus39",email = "homostultus39@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.13,<4.0"
dependencies = [
    "fastapi>=0.128.0,<0.129.0",
    "pydantic>=2.12.5,<3.0.0",
    "pydantic-settings>=2.12.0,<3.0.0",
    "loguru>=0.7.3,<0.8.0",
    "uvicorn>=0.40.0,<0.41.0",
    "docker>=7.1.0,<8.0.0",
    "httpx>=0.28.1,<0.29.0",
    "psutil>=7.2.2,<8.0.0",
    "pyyaml>=6.0.3,<7.0.0",
]

[dependency-groups]
dev = [
    "mypy>=2.1.0,<3.0.0",
    "pytest>=9.0.2,<10.0.0",
    "types-docker>=7.1.0.20260518",
    "types-psutil>=7.2.2.20260518",
    "types-pyyaml>=6.0.12.20260518",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.13"
files = ["src", "tests"]
namespace_packages = true
explicit_package_bases = true
pretty = true
show_error_codes = true
